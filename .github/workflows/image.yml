name: Build studio image

# Builds docker/render.Dockerfile (the studio with its dependencies) and
# publishes ghcr.io/<owner>/<repo>/render:
#   :<branch>   on pushes that touch the studio (":main" on main), for trying
#               a change from a project repository with the workflows' "image" input
#   :vX.Y.Z, :vX, :latest   built by release.yml when a version is released
on:
  push:
    paths:
      - docker/**
      - engine/**
      - tools/**
      - schema/**
      - package.json
      - package-lock.json
      - requirements.txt
      - vite.config.js
      - .github/workflows/image.yml
  workflow_call:
    inputs:
      tags: { type: string, required: true, description: 'Space-separated tags, e.g. "v1.2.0 v1 latest"' }
  workflow_dispatch:
    inputs:
      tags: { type: string, required: true, description: 'Space-separated tags' }

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check Playwright versions match
        run: |
          npm_pw=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")
          grep -q "playwright:v$npm_pw-" docker/render.Dockerfile \
            || { echo "::error::docker/render.Dockerfile must use the playwright:v$npm_pw image"; exit 1; }
      - name: Build, test and push
        env:
          IMAGE: ghcr.io/${{ github.repository }}/render
          TAGS: ${{ inputs.tags }}
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$TAGS" ] || TAGS=$(echo "$BRANCH" | tr '/' '-' | tr -cd 'A-Za-z0-9._-')
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -f docker/render.Dockerfile -t "$IMAGE:build" .
          # the studio works inside the image: tests, a project check, a build
          docker run --rm -v "$PWD/tracks:/w/tracks" -w /w "$IMAGE:build" sh -c \
            'cd /studio && npx vitest run && python3 -m pytest -q test && node tools/check.mjs --projects /w/tracks'
          for t in $TAGS; do docker tag "$IMAGE:build" "$IMAGE:$t"; docker push "$IMAGE:$t"; done
          echo "Pushed $IMAGE: $TAGS" >> "$GITHUB_STEP_SUMMARY"
